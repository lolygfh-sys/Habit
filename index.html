<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="العزيمة">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مساحة العزيمة</title>
<style>
:root{--bg:#f7f3ec;--card:#fffdf9;--beige:#efe8da;--line:#e4ddcf;--tx:#2b2f2a;--mu:#7d8277;--pr:#5f7f66;--prd:#4a6652;--prl:#e3ece4;--rd:#b5604f;--sh:0 2px 10px rgba(60,50,30,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--tx);font:15px/1.6 -apple-system,"SF Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 24px}
h1{font-size:23px;margin:0 0 4px}
h2{font-size:16px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh);margin-bottom:10px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.mu{color:var(--mu);font-size:13px}
.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;background:var(--pr);color:#fff;cursor:pointer;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}.btn.g{background:var(--beige);color:var(--tx)}.btn.d{background:#f4e3df;color:var(--rd)}.btn.sm{padding:6px 12px;font-size:13px}.btn.w{width:100%;margin-top:8px}
.ib{border:0;background:none;color:var(--mu);padding:6px;border-radius:10px;display:grid;place-items:center}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--tx)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid #cfc7b6;background:#fff;flex:none;display:grid;place-items:center;color:#fff;padding:0;transition:.2s}
.chk.on{background:var(--pr);border-color:var(--pr)}
.done .tt{text-decoration:line-through;color:var(--mu)}
.bar{height:8px;background:var(--beige);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);border-radius:8px;transition:width .4s}
.tag{font-size:11px;padding:1px 9px;border-radius:20px;background:var(--beige);color:var(--mu)}
.t-high{background:#fbeceb;border-color:#ecc3be;border-inline-start:6px solid #d0645a}
.t-medium{background:#fcf5dc;border-color:#efe0a8;border-inline-start:6px solid #d9b13b}
.t-low{background:#e8f2e8;border-color:#c5dcc6;border-inline-start:6px solid #6fa578}
.p-high{background:#f4e3df;color:var(--rd)}.p-medium{background:#f6ecd0;color:#8a6d1f}.p-low{background:var(--prl);color:var(--prd)}
nav{position:fixed;inset:auto 0 0 0;background:rgba(255,253,249,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;gap:2px;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--mu);font:inherit;font-size:9.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;border-radius:12px;transition:.2s}
nav button.on{color:var(--prd);background:var(--prl);font-weight:700}
.fab{position:fixed;left:16px;bottom:calc(88px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;box-shadow:0 6px 16px rgba(74,102,82,.35);z-index:15;display:grid;place-items:center;padding:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.grid .card{margin:0}
.big{font-size:24px;font-weight:700;line-height:1.3}
.ov{position:fixed;inset:0;background:rgba(40,35,25,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-90px);background:var(--prd);color:#fff;padding:9px 18px;border-radius:14px;z-index:50;max-width:90%;transition:transform .3s;font-size:14px}
.toast.on{transform:translate(-50%,0)}
.wk{display:flex;gap:4px}
.wk button{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:12px;padding:5px 0;font:inherit;color:var(--mu);display:flex;flex-direction:column;align-items:center;line-height:1.3}
.wk button small{font-size:10px}.wk button.on{background:var(--pr);border-color:var(--pr);color:#fff}.wk button.td{border-color:var(--pr);border-width:2px}.wk button:disabled{opacity:.4}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mu)}
.bars i{display:block;width:100%;background:var(--pr);border-radius:6px 6px 0 0;min-height:3px;opacity:.85}
.empty{text-align:center;color:var(--mu);padding:26px 14px}
.modes{display:flex;gap:6px;justify-content:center}
.modes button{flex:1;border:0;background:var(--beige);color:var(--tx);border-radius:12px;padding:8px 0;font:inherit;font-size:13px}.modes button.on{background:var(--pr);color:#fff}
.bd{opacity:.4;text-align:center;font-size:12px}.bd.on{opacity:1}.bd b{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--beige);margin:0 auto 4px;font-size:20px}.bd.on b{background:var(--prl)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal span{height:24px;border-radius:7px;background:var(--beige);font-size:10px;display:grid;place-items:center;color:var(--mu)}.cal .on{background:var(--pr);color:#fff}.cal .off{background:#f4e3df;color:var(--rd)}.cal .na{opacity:.4}
.dys{flex-wrap:wrap;gap:6px 12px;margin-top:8px}.dys label{display:flex;align-items:center;gap:4px;margin:0;color:var(--tx)}.dys input{width:auto}
summary{cursor:pointer;padding:2px 0}
@media(min-width:700px){nav{max-width:720px;left:50%;right:auto;width:100%;transform:translateX(-50%);border-radius:18px 18px 0 0}}
.ps-done{border-inline-start:5px solid var(--pr)}.ps-missed{border-inline-start:5px solid var(--rd)}.ps-wait{border-inline-start:5px solid #d9b13b}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.mg.hd span{text-align:center;font-size:11px;color:var(--mu)}
.mg button{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:44px;padding:2px;font:inherit;color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.mg button.td{border:2px solid var(--pr)}
.mg b{font-size:13px;font-weight:600}.dot{font-style:normal;font-size:10px;min-width:16px;border-radius:8px;background:transparent;color:var(--mu);text-align:center}.dot.cp{background:var(--beige)}.dot.cd{background:var(--pr);color:#fff}.dot.cm{background:#f4e3df;color:var(--rd)}
.dys-i{display:flex;align-items:center;gap:8px;margin:4px 0;color:var(--tx);font-size:14px}.dys-i input{width:auto}
details summary{cursor:pointer}
.hi{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;font-size:19px;flex:none}
.pk{display:inline-block;margin:0 0 4px 4px}.pk input{display:none}.pk span{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:20px;color:var(--tx)}.pk input:checked+span{border-color:var(--tx);box-shadow:0 0 0 2px var(--prl)}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;direction:ltr;overflow-x:auto}.hm i{width:14px;height:14px;border-radius:4px;display:block}
.wc{width:100%;min-height:26px;border:1px solid var(--line);border-radius:8px;padding:0}.wc:disabled{opacity:.3}
</style>
</head>
<body>
<main></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
const KEY='grit_space_v1',$=s=>document.querySelector(s);
const CATS=['عمل','دراسة','صحة','شخصي','أخرى'],PRI={high:'عالية',medium:'متوسطة',low:'منخفضة'},PER={weekly:'أسبوعي',monthly:'شهري',yearly:'سنوي'};
const DS=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const MOT=['خطوة صغيرة كل يوم تصنع فرقًا كبيرًا.','ابدأ بأصعب مهمة ثم استمتع ببقية اليوم.','الاستمرار أهم من الكمال.','ركّز على التقدّم لا على السرعة.','عاداتك اليوم تصنع نسختك القادمة.','ما تبدأه اليوم يشكرك عليه غدًا.','جلسة تركيز واحدة قد تغيّر يومك.'];
const I={hm:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',tk:'M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h9',hb:'M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3',gl:'M12 3a9 9 0 1 0 9 9M12 7a5 5 0 1 0 5 5M12 12l8-8',fc:'M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z',st:'M4 20V10M10 20V4M16 20v-8M22 20H2',se:'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4',pl:'M12 5v14M5 12h14',ed:'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',tr:'M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14',ck:'M5 12l5 5L20 7',cl:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',nt:'M6 3h9l4 4v14H6zM15 3v4h4M9 12h6M9 16h6',mn:'M4 7h16M4 12h16M4 17h16'};
const ic=(n,s=22)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${I[n]}"/></svg>`;
const TABS=[['home','الرئيسية','hm'],['tasks','المهام','tk'],['habits','العادات','hb'],['goals','الأهداف','gl'],['plan','التخطيط','cl'],['notes','الملاحظات','nt'],['focus','التركيز','fc'],['stats','الإحصاءات','st'],['settings','الإعدادات','se']];
const MAIN=['home','tasks','plan','focus'];
$('#nav').innerHTML=TABS.filter(t=>MAIN.includes(t[0])).map(t=>`<button data-tab="${t[0]}">${ic(t[2],21)}<span>${t[1]}</span></button>`).join('')+`<button data-more="1">${ic('mn',21)}<span>المزيد</span></button>`;

/* ---------- أدوات التاريخ ---------- */
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const pd=s=>new Date(s+'T12:00:00');
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const TD=()=>ymd(new Date());
const wkD=d=>{const s=addD(d,-((d.getDay()-S.ws+7)%7));return[...Array(7)].map((_,i)=>ymd(addD(s,i)))};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=s=>s?new Intl.DateTimeFormat('ar-u-nu-latn',{day:'numeric',month:'short'}).format(pd(s)):'';
const fm=m=>m>=60?Math.floor(m/60)+' س '+(m%60)+' د':m+' د';
const opt=(a,v)=>a.map(([k,l])=>`<option value="${k}" ${k===v?'selected':''}>${l}</option>`).join('');

/* ---------- البيانات ---------- */
const def=()=>({v:3,name:'',ws:6,tasks:[],habits:[],goals:[],awarded:{},focus:{sessions:0,minutes:0,log:{},hist:[]},subjects:[],plans:[{id:'p1',name:'جدولي'}],curPlan:'p1',sess:[],busy:[],notes:[],rv:[1,3,7,14,30],org:{from:'16:00',to:'21:00',gap:10,dur:45}});
function clean(r){const d=def();if(!r||typeof r!=='object')return d;
 const A=x=>Array.isArray(x)?x.filter(o=>o&&typeof o==='object'&&o.id):[];
 d.name=typeof r.name==='string'?r.name.slice(0,30):'';
 d.ws=[0,1,6].includes(r.ws)?r.ws:6;
 d.tasks=A(r.tasks).map(t=>({...t,title:String(t.title||''),pri:PRI[t.pri]?t.pri:'medium',cat:t.cat||'أخرى',due:t.due||null,done:!!t.done,rep:['daily','weekly'].includes(t.rep)?t.rep:'none',days:Array.isArray(t.days)?t.days.filter(i=>i>=0&&i<=6):[],log:t.log&&typeof t.log==='object'?t.log:{},created:t.created||ymd(new Date())}));
 d.habits=A(r.habits).map(h=>{const cr=h.created||ymd(new Date());return{...h,title:String(h.title||''),log:h.log&&typeof h.log==='object'?h.log:{},type:h.type==='weekly'?'weekly':'daily',target:Math.min(7,Math.max(1,+h.target||1)),created:cr,
  desc:String(h.desc||'').slice(0,120),icon:typeof h.icon==='string'&&h.icon?h.icon.slice(0,4):'🎯',col:/^#[0-9a-f]{6}$/i.test(h.col||'')?h.col:'#5f7f66',cat:CATS.includes(h.cat)?h.cat:'شخصي',
  days:Array.isArray(h.days)?[...new Set(h.days.map(Number).filter(n=>n>=0&&n<=6))]:[],kind:['count','time'].includes(h.kind)?h.kind:'check',tg:Math.max(1,Math.round(+h.tg)||1),unit:String(h.unit||'').slice(0,12),
  start:h.start||cr,wg:Math.min(7,Math.max(0,Math.round(+h.wg)||0)),gid:typeof h.gid==='string'?h.gid:'',rem:/^\d\d:\d\d$/.test(h.rem||'')?h.rem:'',val:h.val&&typeof h.val==='object'?h.val:{},
  pz:Array.isArray(h.pz)?h.pz.filter(r=>Array.isArray(r)&&r[0]):[],arch:h.arch||null}});
 d.goals=A(r.goals).map(g=>({...g,title:String(g.title||''),period:PER[g.period]?g.period:'weekly',ms:Array.isArray(g.ms)?g.ms.filter(m=>m&&m.id):[],manual:Math.min(100,Math.max(0,+g.manual||0))}));
 d.awarded=r.awarded&&typeof r.awarded==='object'?r.awarded:{};
 const f=r.focus||{};d.focus={sessions:+f.sessions||0,minutes:+f.minutes||0,log:f.log&&typeof f.log==='object'?f.log:{},hist:Array.isArray(f.hist)?f.hist.filter(x=>x&&x.id):[]};
 const TM=x=>/^\d\d:\d\d$/.test(x),ids=new Set();
 d.subjects=A(r.subjects).map(x=>({...x,name:String(x.name||''),lessons:(Array.isArray(x.lessons)?x.lessons:[]).filter(l=>l&&l.id).map(l=>({...l,t:String(l.t||''),st:['new','prog','done'].includes(l.st)?l.st:'new',pri:PRI[l.pri]?l.pri:'medium',note:String(l.note||''),next:l.next||null,revs:Array.isArray(l.revs)?l.revs.filter(q=>q&&q.d):[],created:l.created||ymd(new Date())}))}));
 d.plans=A(r.plans).map(x=>({...x,name:String(x.name||'')}));if(!d.plans.length)d.plans=[{id:'p1',name:'جدولي'}];
 d.curPlan=d.plans.some(x=>x.id===r.curPlan)?r.curPlan:d.plans[0].id;
 d.sess=A(r.sess).map(x=>({...x,plan:d.plans.some(p=>p.id===x.plan)?x.plan:d.plans[0].id,date:x.date||ymd(new Date()),start:TM(x.start)?x.start:'16:00',dur:Math.min(600,Math.max(5,+x.dur||45)),rep:['daily','weekly'].includes(x.rep)?x.rep:'none',until:x.until||null,log:x.log&&typeof x.log==='object'?x.log:{},note:String(x.note||''),title:String(x.title||''),subj:x.subj||null,less:x.less||null}));
 d.busy=A(r.busy).map(x=>({...x,t:String(x.t||''),day:Math.min(6,Math.max(0,+x.day||0)),from:TM(x.from)?x.from:'17:00',to:TM(x.to)?x.to:'18:00'}));
 const o=r.org||{};d.org={from:TM(o.from)?o.from:'16:00',to:TM(o.to)?o.to:'21:00',gap:isNaN(+o.gap)||o.gap===undefined?10:Math.min(60,Math.max(0,+o.gap)),dur:isNaN(+o.dur)||!o.dur?45:Math.min(240,Math.max(10,+o.dur))};
 d.notes=A(r.notes).map(n=>({...n,t:String(n.t||'').slice(0,100),body:String(n.body||'').slice(0,5000),cat:['note','study','mistake','idea'].includes(n.cat)?n.cat:'note',tags:Array.isArray(n.tags)?n.tags.map(String).slice(0,10):[],fav:!!n.fav,link:typeof n.link==='string'?n.link:'',created:n.created||ymd(new Date()),mod:n.mod||n.created||ymd(new Date())}));
 d.rv=Array.isArray(r.rv)&&r.rv.length&&r.rv.length<=10&&r.rv.every(x=>+x>=1&&+x<=365)?r.rv.map(x=>Math.round(+x)):[1,3,7,14,30];
 d.v=3;
 return d}
function load(){try{const raw=localStorage.getItem(KEY),j=JSON.parse(raw);try{if(raw&&!localStorage.getItem(KEY+'_pre_habits'))localStorage.setItem(KEY+'_pre_habits',raw)}catch(e){}if(j&&(j.v||1)<2&&!localStorage.getItem(KEY+'_v1_backup'))localStorage.setItem(KEY+'_v1_backup',raw);if(j&&(j.v||1)<3&&!localStorage.getItem(KEY+'_v2_backup'))localStorage.setItem(KEY+'_v2_backup',raw);return clean(j)}catch(e){return def()}}
let S=load(),tab='home',F={st:'all',cat:'all',sort:'deadline'};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('تعذّر الحفظ، قد يكون التخزين معطّلًا')}}
function uid(){const used=new Set([...S.tasks,...S.habits,...S.goals,...S.goals.flatMap(g=>g.ms),...S.sess,...S.subjects,...S.subjects.flatMap(x=>x.lessons),...S.plans,...S.busy,...S.focus.hist,...S.notes].map(x=>x.id));let i;do{i=Date.now().toString(36)+Math.random().toString(36).slice(2,6)}while(used.has(i));return i}
let tm;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- المنطق ---------- */
const xpT=()=>Object.values(S.awarded).reduce((a,o)=>a+(+o.x||0),0);
const lvl=()=>{const x=xpT();return{x,n:Math.floor(x/100)+1,cur:x%100}};
function award(k,x){if(S.awarded[k])return;const b=lvl().n;S.awarded[k]={x,d:TD()};toast(lvl().n>b?'مستوى جديد! أنت الآن في المستوى '+lvl().n:'+'+x+' نقطة خبرة')}
const cnt=p=>Object.keys(S.awarded).filter(k=>k.startsWith(p)).length;
function dayProgress(d){const ts=S.tasks.filter(t=>isRep(t)?sched(t,d):t.due===d),hs=S.habits.filter(h=>hDue(h,d));
 const td=ts.filter(t=>doneOn(t,d)).length,hd=hs.filter(h=>h.log[d]).length,total=ts.length+hs.length,done=td+hd;
 return{td,tt:ts.length,hd,ht:hs.length,done,total,pct:total?Math.round(done/total*100):0}}
const isRep=t=>t.rep==='daily'||t.rep==='weekly';
const sched=(t,d)=>isRep(t)&&d>=t.created&&(t.rep==='daily'||t.days.includes(pd(d).getDay()));
const doneOn=(t,d)=>isRep(t)?!!t.log[d]:!!t.done;
function repStats(t){let s7=0,d7=0,s30=0,d30=0,st=0,brk=false;
 for(let i=0;i<400;i++){const d=ymd(addD(new Date(),-i));if(d<t.created)break;if(!sched(t,d))continue;const dn=!!t.log[d];
  if(!(i===0&&!dn)){if(i<7){s7++;d7+=dn}if(i<30){s30++;d30+=dn}}
  if(!brk){if(dn)st++;else if(i>0)brk=true}}
 const r=(a,b)=>b?Math.round(a/b*100):0;return{n:Object.keys(t.log).length,st,r7:r(d7,s7),r30:r(d30,s30)}}
function checkDay(){const p=dayProgress(TD());if(p.total&&p.done===p.total)award('day:'+TD(),20)}
function streak(h){if(h.type!=='weekly')return hSt(h).cur;let n=0,d=new Date();
 if(h.type==='weekly'){let first=true;for(let i=0;i<260;i++){const c=wkD(d).filter(x=>h.log[x]).length;if(c>=h.target)n++;else if(!first)break;first=false;d=addD(d,-7)}return n}
 if(!h.log[ymd(d)])d=addD(d,-1);
 while(h.log[ymd(d)]){n++;d=addD(d,-1)}return n}

function modal(h){closeM();const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML=`<div class="sheet">${h}</div>`;o.addEventListener('click',e=>{if(e.target===o)closeM()});document.body.appendChild(o)}
function closeM(){const o=$('#ov');if(o)o.remove()}
function form(k,id){const e=(id&&({task:S.tasks,habit:S.habits,goal:S.goals}[k]).find(x=>x.id===id))||{};let f,n;
 if(k==='task'){n='مهمة';f=`<label>عنوان المهمة</label><input name="title" maxlength="80" required value="${esc(e.title)}"><label>نوع المهمة</label><select name="rep">${opt([['none','مهمة عادية (مرة واحدة)'],['daily','متكررة يوميًا'],['weekly','متكررة أسبوعيًا']],e.rep||'none')}</select><div id="dys" class="row dys" style="display:${e.rep==='weekly'?'flex':'none'}">${DS.map((n,i)=>`<label><input type="checkbox" name="d${i}" ${(e.days||[]).includes(i)?'checked':''}>${n}</label>`).join('')}</div><label>الموعد النهائي (للمهمة العادية)</label><input type="date" name="due" value="${e.due||''}"><label>الأولوية</label><select name="pri">${opt(Object.entries(PRI),e.pri||'medium')}</select><label>التصنيف</label><select name="cat">${opt(CATS.map(c=>[c,c]),e.cat||CATS[0])}</select>`}
 else if(k==='habit'){n='عادة';f=`<label>اسم العادة</label><input name="title" maxlength="60" required value="${esc(e.title)}"><label>التكرار</label><select name="type">${opt([['daily','يومية'],['weekly','أسبوعية']],e.type||'daily')}</select><label>عدد المرات في الأسبوع (للأسبوعية)</label><input type="number" name="target" min="1" max="7" value="${e.target||3}">`}
 else{n='هدف';f=`<label>عنوان الهدف</label><input name="title" maxlength="80" required value="${esc(e.title)}"><label>نوع الهدف</label><select name="period">${opt(Object.entries(PER),e.period||'weekly')}</select><label>التاريخ المستهدف</label><input type="date" name="date" value="${e.date||''}">${id?'':'<label>الخطوات (كل خطوة في سطر)</label><textarea name="ms" rows="3" maxlength="800"></textarea>'}`}
 modal(`<form data-k="${k}" data-id="${id||''}"><h2>${id?'تعديل':'إضافة'} ${n}</h2>${f}<div class="row" style="margin-top:18px"><button class="btn sp">حفظ</button><button type="button" class="btn g" data-act="cm">إلغاء</button></div></form>`)}

document.addEventListener('submit',e=>{e.preventDefault();if(e.target.dataset.pk)return;const f=e.target,k=f.dataset.k,id=f.dataset.id,v=Object.fromEntries(new FormData(f)),title=(v.title||'').trim();
 if(!title){toast('اكتب عنوانًا أولًا');return}
 const put=(arr,o)=>{if(id){Object.assign(arr.find(x=>x.id===id),o)}else arr.push({id:uid(),...o})};
 if(k==='task'){const rp=['daily','weekly'].includes(v.rep)?v.rep:'none',days=rp==='weekly'?[0,1,2,3,4,5,6].filter(i=>v['d'+i]):[];if(rp==='weekly'&&!days.length){toast('اختر يومًا واحدًا على الأقل');return}
  const o={title,rep:rp,days,due:rp==='none'?(v.due||null):null,pri:PRI[v.pri]?v.pri:'medium',cat:CATS.includes(v.cat)?v.cat:'أخرى'};
  if(id){const t0=byId(S.tasks,id);o.log=t0.log||{};o.created=t0.created||TD();put(S.tasks,o)}else put(S.tasks,{...o,done:false,doneAt:null,log:{},created:TD()})}
 else if(k==='habit'){const o={title,type:v.type==='weekly'?'weekly':'daily',target:Math.min(7,Math.max(1,parseInt(v.target)||1))};if(id)put(S.habits,o);else put(S.habits,{...o,log:{},created:TD()})}
 else{const o={title,period:PER[v.period]?v.period:'weekly',date:v.date||null};if(id)put(S.goals,o);else{const g={id:uid(),...o,manual:0,ms:[]};S.goals.push(g);(v.ms||'').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,20).forEach(t=>g.ms.push({id:uid(),t:t.slice(0,80),done:false}))}}
 closeM();save();render()});

/* ---------- الأحداث ---------- */
const byId=(a,id)=>a.find(x=>x.id===id);
function exp(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='grit-space-backup-'+TD()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
document.addEventListener('click',e=>{
 const nb=e.target.closest('#nav button');if(nb){if(nb.dataset.more){openMore();return}tab=nb.dataset.tab;render();scrollTo(0,0);return}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,d=b.dataset.d;let ch=1;
 if(a==='tt'){const t=byId(S.tasks,id),T0=TD();
  if(isRep(t)){if(!sched(t,T0)){toast('هذه المهمة غير مجدولة اليوم');return}if(t.log[T0])delete t.log[T0];else{t.log[T0]=1;award('task:'+id+':'+T0,{high:15,medium:10,low:5}[t.pri]||10);checkDay()}}
  else{t.done=!t.done;t.doneAt=t.done?TD():null;if(t.done){award('task:'+id,{high:15,medium:10,low:5}[t.pri]||10);checkDay()}}}
 else if(a==='hd')toggleHabit(byId(S.habits,id),d);
 else if(a==='mt'){const g=byId(S.goals,id),m=byId(g.ms,d);m.done=!m.done;if(m.done){award('ms:'+id+':'+d,10);if(gp(g)===100)award('goal:'+id,50)}}
 else if(a==='am'){const g=byId(S.goals,id),i=document.getElementById('nm'+id),t=i.value.trim();if(!t){toast('اكتب الخطوة أولًا');return}g.ms.push({id:uid(),t:t.slice(0,80),done:false})}
 else if(a==='dm'){if(!confirm('حذف هذه الخطوة؟'))return;const g=byId(S.goals,id);g.ms=g.ms.filter(m=>m.id!==d)}
 else if(a==='dt'){if(!confirm('حذف هذه المهمة؟'))return;S.tasks=S.tasks.filter(x=>x.id!==id)}
 else if(a==='dh'){if(!confirm('حذف هذه العادة وسجلّها؟'))return;S.habits=S.habits.filter(x=>x.id!==id)}
 else if(a==='dg'){if(!confirm('حذف هذا الهدف؟'))return;S.goals=S.goals.filter(x=>x.id!==id)}
 else if(a==='nt'){form('task');return}else if(a==='et'){form('task',id);return}
 else if(a==='nh'){hForm();return}else if(a==='eh'){hForm(id);return}
 else if(a==='ng'){form('goal');return}else if(a==='eg'){form('goal',id);return}
 else if(a==='cm'){closeM();return}
 else if(a==='md'){setMode(id);return}
 else if(a==='ts'||a==='tres'){tStart();return}
 else if(a==='tp'){tPause();return}
 else if(a==='tr0'){tReset();return}
 else if(a==='te'){tEnd();return}
 else if(a==='ex'){exp();return}
 else if(a==='im'){$('#imp').click();return}
 else if(a==='rs'){if(!confirm('سيتم حذف كل بياناتك نهائيًا. هل أنت متأكد؟')||!confirm('تأكيد أخير: لا يمكن التراجع. حذف كل شيء؟'))return;S=def();toast('تم حذف البيانات')}
 else ch=0;
 if(ch){save();render()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.name==='rep'){$('#dys').style.display=t.value==='weekly'?'flex':'none'}
 else if(t.dataset.f){F[t.dataset.f]=t.value;render()}
 else if(t.dataset.s){if(t.dataset.s==='name')S.name=t.value.trim().slice(0,30);else S.ws=+t.value;save();toast('تم الحفظ')}
 else if(t.dataset.gp){const g=byId(S.goals,t.dataset.gp);g.manual=+t.value;if(g.manual===100)award('goal:'+g.id,50);save();render()}
 else if(t.id==='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||!Array.isArray(j.tasks)||!Array.isArray(j.habits))throw 0;if((j.v||1)>3){toast('هذه النسخة أنشئت بإصدار أحدث من التطبيق');return}if(!confirm('سيتم استبدال بياناتك الحالية بالنسخة المستوردة. متابعة؟'))return;S=clean(j);save();render();toast('تم الاستيراد بنجاح')}catch(x){toast('الملف غير صالح')}};r.readAsText(t.files[0]);t.value=''}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.nm){e.preventDefault();document.querySelector(`[data-act="am"][data-id="${e.target.dataset.nm}"]`).click()}});
/* ===== التخطيط الدراسي ===== */
const PL={sub:'sch',view:'day',date:TD(),prop:null,miss:0,pw:0,sel:new Set(),open:{},pend:null};
const DSF=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const ST={new:'لم أبدأ',prog:'قيد المراجعة',done:'تمت المراجعة'},NX={new:'prog',prog:'done',done:'new'};
const tmn=s=>{const a=String(s).split(':');return(+a[0])*60+(+a[1])};
const mth=n=>p2(Math.floor(n/60))+':'+p2(n%60);
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const subj=id=>S.subjects.find(s=>s.id===id),lesn=(a,b)=>{const s=subj(a);return s&&s.lessons.find(l=>l.id===b)};
const lkName=L=>{if(!L)return'';const s=subj(L.subj),l=lesn(L.subj,L.less);return[s&&s.name,l&&l.t].filter(Boolean).join(' — ')||L.title||'مراجعة'};
const sname=x=>x.title||lkName(x);
const occOn=(x,d)=>x.rep==='none'?x.date===d:d>=x.date&&(!x.until||d<=x.until)&&(x.rep==='daily'||pd(d).getDay()===pd(x.date).getDay());
const occ=(d,pl)=>S.sess.filter(x=>(pl===null||x.plan===S.curPlan)&&occOn(x,d)&&x.log[d]!=='moved').map(x=>({x,d,st:x.log[d]||''})).sort((a,b)=>a.x.start.localeCompare(b.x.start));
const isPast=o=>o.d<TD()||(o.d===TD()&&tmn(o.x.start)+o.x.dur<=nowMin());
const cntOcc=ds=>{let t=0,d=0,m=0;ds.forEach(x=>occ(x,null).forEach(o=>{t++;if(o.st==='done')d++;if(o.st==='missed')m++}));return{t,d,m,p:t?Math.round(d/t*100):0}};
const fMin=(sid,lid)=>S.focus.hist.filter(h=>h.subj===sid&&(!lid||h.less===lid)).reduce((a,h)=>a+h.min,0);
const lateList=()=>{const r=[];for(let i=14;i>=0;i--){const d=ymd(addD(new Date(),-i));occ(d,null).forEach(o=>{if(!o.st&&isPast(o))r.push(o)})}return r};
const conf=(date,start,dur,skip)=>{const a=tmn(start),b=a+dur,r=[];occ(date,null).forEach(o=>{if(o.x.id!==skip&&a<tmn(o.x.start)+o.x.dur&&tmn(o.x.start)<b)r.push(sname(o.x))});S.busy.forEach(c=>{if(c.day===pd(date).getDay()&&a<tmn(c.to)&&tmn(c.from)<b)r.push(c.t)});return r};
function setSt(id,d,st,force){const x=S.sess.find(s=>s.id===id);if(!x)return;const L=lesn(x.subj,x.less);
 if(x.log[d]===st){if(force)return;delete x.log[d];if(L)L.revs=L.revs.filter(r=>!(r.sid===id&&r.d===d))}
 else{x.log[d]=st;if(L){L.revs=L.revs.filter(r=>!(r.sid===id&&r.d===d));if(st==='done'){L.revs.push({d,min:x.dur,sid:id});if(L.st==='new')L.st='prog'}}if(st==='done')award('sess:'+id+':'+d,10)}
 save();render()}
function startFocus(L){if(T.run){toast('هناك جلسة تركيز جارية');tab='focus';render();return}T.mode='focus';T.left=dur('focus');T.start=0;T.link=L;tab='focus';tStart()}
function afterFocus(L,min){PL.pend={L,min};modal(`<h2>انتهت جلسة التركيز (${min} د)</h2><div class="mu" style="margin-bottom:12px">${esc(lkName(L))}</div><b>هل أتممت المراجعة؟</b><div class="row" style="margin-top:14px"><button class="btn sp" data-act="p:fdone">نعم، تمت</button><button class="btn g sp" data-act="p:fprog">لا، أبقِها قيد المراجعة</button></div>`)}
const pm=(pk,id,title,f,extra='')=>modal(`<form data-pk="${pk}" data-id="${id||''}" ${extra}><h2>${title}</h2>${f}<div class="row" style="margin-top:18px"><button class="btn sp">حفظ</button><button type="button" class="btn g" data-act="cm">إلغاء</button></div></form>`);
function sForm(id,pre){const x=(id&&S.sess.find(s=>s.id===id))||pre||{};
 const lo=[['','بدون ربط'],...S.subjects.flatMap(s=>[[s.id+'|',s.name+' (عام)'],...s.lessons.map(l=>[s.id+'|'+l.id,s.name+' — '+l.t])])];
 pm('sess',id,(id?'تعديل':'إضافة')+' حصة',`<label>المادة / الدرس</label><select name="lk">${opt(lo,x.subj?x.subj+'|'+(x.less||''):'')}</select><label>عنوان (اختياري عند ربط درس)</label><input name="title" maxlength="60" value="${esc(x.title)}"><label>التاريخ</label><input type="date" name="date" required value="${x.date||PL.date}"><div class="row"><div class="sp"><label>البداية</label><input type="time" name="start" required value="${x.start||'16:00'}"></div><div class="sp"><label>المدة (دقيقة)</label><input type="number" name="dur" min="5" max="600" required value="${x.dur||S.org.dur}"></div></div><label>التكرار</label><select name="rep">${opt([['none','بدون تكرار'],['daily','يوميًا'],['weekly','أسبوعيًا']],x.rep||'none')}</select><label>ينتهي التكرار في (اختياري)</label><input type="date" name="until" value="${x.until||''}"><label>ملاحظات</label><textarea name="note" rows="2" maxlength="300">${esc(x.note)}</textarea>`)}
function ppForm(id,d){const x=S.sess.find(s=>s.id===id);if(!x)return;pm('pp',id,'تأجيل / نقل الحصة',`<label>التاريخ الجديد</label><input type="date" name="date" required value="${d}"><label>وقت البداية</label><input type="time" name="start" required value="${x.start}">`,`data-d="${d}"`)}
function lForm(sid,lid){const l=(lid&&lesn(sid,lid))||{};pm('lesn',lid,(lid?'تعديل':'إضافة')+' درس',`<label>عنوان الدرس</label><input name="t" maxlength="80" required value="${esc(l.t)}"><label>الحالة</label><select name="st">${opt(Object.entries(ST),l.st||'new')}</select><label>الأولوية</label><select name="pri">${opt(Object.entries(PRI),l.pri||'medium')}</select><label>موعد المراجعة القادمة (اختياري)</label><input type="date" name="next" value="${l.next||''}"><label>ملاحظات</label><textarea name="note" rows="2" maxlength="300">${esc(l.note)}</textarea>`,`data-sid="${sid}"`)}
const sCard=o=>{const x=o.x,w=!o.st&&isPast(o),lbl=o.st==='done'?'تمت ✓':o.st==='missed'?'لم تتم ✗':w?'بانتظار التأكيد':'';
 return `<div class="card ps-${o.st||(w?'wait':'')}"><div class="row"><div class="sp"><b>${esc(sname(x))}</b><div class="mu">${x.start}–${mth(tmn(x.start)+x.dur)} • ${x.dur} د${x.rep!=='none'?' • 🔁 '+(x.rep==='daily'?'يوميًا':'أسبوعيًا'):''}</div>${x.note?`<div class="mu">${esc(x.note)}</div>`:''}</div>${lbl?`<span class="tag">${lbl}</span>`:''}</div><div class="row" style="gap:6px;flex-wrap:wrap;margin-top:8px"><button class="btn sm" data-act="p:f" data-id="${x.id}" data-d="${o.d}">▶ ابدأ التركيز</button><button class="btn sm g" data-act="p:done" data-id="${x.id}" data-d="${o.d}">✓ تمت</button><button class="btn sm g" data-act="p:miss" data-id="${x.id}" data-d="${o.d}">✗ لم تتم</button><button class="btn sm g" data-act="p:pp" data-id="${x.id}" data-d="${o.d}">تأجيل</button><button class="ib" data-act="p:pe" data-id="${x.id}" aria-label="تعديل">${ic('ed',18)}</button><button class="ib" data-act="p:px" data-id="${x.id}" aria-label="حذف">${ic('tr',18)}</button></div></div>`};
function vPlan(){const t=[['sch','الجدول'],['sub','المواد'],['stat','الإحصاءات'],['org','التنظيم']];
 return `<h1>التخطيط الدراسي</h1><div class="modes" style="margin:12px 0">${t.map(x=>`<button class="${PL.sub===x[0]?'on':''}" data-act="p:sub" data-id="${x[0]}">${x[1]}</button>`).join('')}</div>`+({sch:vSch,sub:vSubs,stat:vPStats,org:vOrg}[PL.sub])()}
function vSch(){const d=PL.date,V=PL.view,f=(x,o)=>new Intl.DateTimeFormat('ar-u-nu-latn',o).format(pd(x));let body,lbl;
 if(V==='day'){lbl=f(d,{weekday:'long',day:'numeric',month:'long'});const os=occ(d);body=os.length?os.map(sCard).join(''):`<div class="card empty">لا حصص في هذا اليوم.<br>اضغط + لإضافة حصة.</div>`}
 else if(V==='week'){const ds=wkD(pd(d));lbl=f(ds[0],{day:'numeric',month:'short'})+' – '+f(ds[6],{day:'numeric',month:'short'});
  body=ds.map(x=>{const os=occ(x),dn=os.filter(o=>o.st==='done').length;return `<div class="card" ${x===TD()?'style="border-color:var(--pr)"':''}><div class="row" data-act="p:goto" data-d="${x}"><b class="sp">${DSF[pd(x).getDay()]} ${+x.slice(8)}</b><span class="mu">${dn}/${os.length}</span></div>${os.length?`<div style="margin:6px 0">${bar(Math.round(dn/os.length*100))}</div>`+os.map(o=>`<div class="row" style="padding:4px 0" data-act="p:goto" data-d="${x}"><span class="tag">${o.x.start}</span><span class="sp">${esc(sname(o.x))}</span><span>${o.st==='done'?'✓':o.st==='missed'?'✗':''}</span></div>`).join(''):''}</div>`}).join('')}
 else{const b=pd(d.slice(0,8)+'01'),n=new Date(b.getFullYear(),b.getMonth()+1,0).getDate(),lead=(b.getDay()-S.ws+7)%7;lbl=f(d,{month:'long',year:'numeric'});let c='';
  for(let i=0;i<lead;i++)c+='<span></span>';

function hCard(h){const T0=TD(),days=wkD(new Date()),w=h.type==='weekly',st=hSt(h),c=days.filter(d=>h.log[d]).length,pz=h.pz.some(r=>!r[1]),off=h.arch?'مؤرشفة':pz?'متوقفة مؤقتًا':'',g=h.gid&&S.goals.find(x=>x.id===h.gid);

function hCal(){const T0=TD(),act=S.habits.filter(h=>!h.arch),h1=HB.cal==='all'?null:S.habits.find(h=>h.id===HB.cal),cd=HB.cd;let body,lbl;

 const s0=addD(new Date(),-105),st=addD(s0,-((s0.getDay()-S.ws+7)%7));let hc='';for(let i=0;i<112;i++){const x=ymd(addD(st,i));hc+=`<i title="${x}" style="background:${hCell(h1,x,act)}${x===T0?';outline:1.5px solid var(--pr)':''}"></i>`}
 return `<select data-hc="1" style="margin-bottom:8px">${opt([['all','كل العادات'],...act.map(h=>[h.id,h.title])],h1?h1.id:'all')}</select>
 <div class="modes" style="margin-bottom:8px">${[['month','شهري'],['week','أسبوعي']].map(x=>`<button class="${HB.cv===x[0]?'on':''}" data-act="h:cv" data-id="${x[0]}">${x[1]}</button>`).join('')}</div>
 <div class="row" style="margin-bottom:10px"><button class="btn sm g" data-act="h:cn" data-id="-1" aria-label="السابق">›</button><b class="sp" style="text-align:center">${lbl}</b><button class="btn sm g" data-act="h:cn" data-id="1" aria-label="التالي">‹</button></div>${body}

function hStat(){const T0=TD(),hs=S.habits.filter(h=>!h.arch);
 const day=d=>{const L=hs.filter(h=>hDue(h,d));return{n:L.length,c:L.filter(h=>h.log[d]).length}};
 const pct=a=>{const n=a.reduce((s,x)=>s+x.n,0),c=a.reduce((s,x)=>s+x.c,0);return n?Math.round(c/n*100):null};
 const l7=[...Array(7)].map((_,i)=>ymd(addD(new Date(),-(6-i)))),b7=l7.map(d=>pct([day(d)])||0);
 const wp=k=>pct(wkD(addD(new Date(),-7*k)).filter(x=>x<=T0).map(day)),w8=[...Array(8)].map((_,i)=>wp(7-i)||0),w4=[0,1,2,3].map(wp).filter(x=>x!==null);

 const tot=S.habits.reduce((a,h)=>a+Object.keys(h.log).length,0),best=Math.max(0,...S.habits.map(h=>h.type==='weekly'?streak(h):hSt(h).best));
 const rk=hs.map(h=>({h,p:hRate(h,30)})).sort((a,b)=>b.p-a.p),top=rk.slice(0,3),low=rk.length>3?rk.slice(-3).reverse():[];
 const li=a=>a.map(o=>`<div class="row" style="padding:3px 0"><span>${esc(o.h.icon)}</span><span class="sp">${esc(o.h.title)}</span><span class="mu">${o.p}%</span></div>`).join('');
 const bars=(a,lb)=>`<div class="bars">${a.map((v,i)=>`<div><span>${v}%</span><i style="height:${Math.max(3,v*.8)}%"></i><span>${lb[i]}</span></div>`).join('')}</div>`;
 if(!S.habits.length)return `<div class="card empty">أضف عادات لتظهر إحصاءاتك هنا.</div>`;
 return `<div class="grid"><div class="card"><div class="big">${pct([day(T0)])??0}%</div><div class="mu">التزام اليوم</div></div><div class="card"><div class="big">${w4.length?Math.round(w4.reduce((a,b)=>a+b,0)/w4.length):0}%</div><div class="mu">متوسط الأسبوع (4 أسابيع)</div></div><div class="card"><div class="big">${mo??0}%</div><div class="mu">التزام هذا الشهر</div></div><div class="card"><div class="big">${tot}</div><div class="mu">إجمالي الإنجازات</div></div></div>
 <div class="card"><b>أطول سلسلة</b> <span class="mu">${best} ${S.habits.some(h=>h.type==='weekly')?'(يوم/أسبوع)':'يوم'}</span></div>

function hGoal(g){const L=S.habits.filter(h=>h.gid===g.id&&!h.arch);if(!L.length)return'';return `<div style="margin-top:8px"><div class="mu">العادات المرتبطة</div>${L.map(h=>`<div class="row" style="padding:4px 0"><span>${esc(h.icon)}</span><span class="sp">${esc(h.title)}</span><span class="mu">سلسلة ${hSt(h).cur} • ${hRate(h,7)}% (7 أيام)</span></div>`).join('')}</div>`}

document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.pk!=='hab')return;e.preventDefault();const fm_=new FormData(f),v=Object.fromEntries(fm_),id=f.dataset.id,title=(v.title||'').trim();
