<style>

html[data-pal=navy]{--bg:#f2f5fb;--card:#fff;--beige:#e7ecf6;--line:#d9e1ef;--tx:#16213a;--mu:#5f6d8c;--pr:#1f3a6e;--prd:#162c55;--prl:#e1e8f6;--rd:#a84636;--yt:#76590e;--sh:0 2px 10px rgba(20,35,70,.08);--chkb:#b8c4dc;--navbg:rgba(255,255,255,.96);--prrgb:31,58,110}

function widgetData(){let fresh=null;try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&Array.isArray(j.tasks))fresh=clean(j)}catch(e){}
 const keep=S;if(fresh)S=fresh;
 try{const d=TD(),po={high:0,medium:1,low:2};
  const ts=S.tasks.filter(t=>isRep(t)?sched(t,d):(t.due===d||t.doneAt===d||(!t.done&&(t.due?true:WG_INCLUDE_UNDATED)))).map(t=>({title:String(t.title).slice(0,60),priority:PRI[t.pri]?t.pri:'medium',done:!!doneOn(t,d),due:t.due||'9',g:(isRep(t)||(t.due&&t.due<=d))?0:t.due?1:2}));
  ts.sort((x,y)=>x.done-y.done||x.g-y.g||po[x.priority]-po[y.priority]||x.due.localeCompare(y.due));
  const out=ts.slice(0,40).map(({title,priority,done})=>({title,priority,done})),dn=out.filter(t=>t.done).length;

   await idbBackup('pre-restore',JSON.stringify(S),Date.now());S=clean(j);save();await idbList();render();toast('تمت الاستعادة')}catch(x){toast('تعذّرت الاستعادة')}})()}});
/* ===== المساعد الذكي (منطق محلي مبني على بياناتك، بدون نموذج لغوي) ===== */
const AS={q:'',a:null,day:0};
const AQ=['ماذا أبدأ به اليوم؟','كم مهمة أنجزت هذا الأسبوع؟','كم ركزت هذا الأسبوع؟','ما أكثر عادة منتظمة؟','ما أقل عادة التزامًا؟','ما المهام المتأخرة؟','ما الاختبارات القادمة؟','كم نقطة ومستوى؟'];
function asRank(){const T0=TD();return S.tasks.filter(t=>isRep(t)?(sched(t,T0)&&!t.log[T0]):!t.done).map(t=>{let sc={high:30,medium:15,low:5}[t.pri]||15;const why=[];if(t.pri==='high')why.push('أولوية عالية');
 if(isRep(t)){sc+=18;why.push('متكررة اليوم')}else if(t.due){const d=Math.ceil((pd(t.due)-pd(T0))/864e5);if(d<0){sc+=40+Math.min(20,-d*3);why.push('متأخرة '+(-d)+' يوم')}else if(d===0){sc+=35;why.push('موعدها اليوم')}else if(d<=2){sc+=20;why.push('موعدها بعد '+d+' يوم')}else if(d<=7)sc+=8}
 const pp=(t.ph||[]).length;if(pp){sc+=Math.min(15,pp*5);why.push('أُجّلت '+pp+' مرات')}if(t.gid||t.pid){sc+=6;why.push('مرتبطة بهدف أو مشروع')}return{t,sc,why}}).sort((a,b)=>b.sc-a.sc)}
function asPlan(day){const dt=ymd(addD(new Date(),day)),O=S.org,from=tmn(O.from),to=tmn(O.to),gap=O.gap,w0=pd(dt).getDay();
 const used=[...occ(dt,null).map(o=>[tmn(o.x.start),tmn(o.x.start)+o.x.dur]),...S.busy.filter(b=>b.day===w0).map(b=>[tmn(b.from),tmn(b.to)])];
 const start=day===0?Math.max(from,Math.ceil(nowMin()/15)*15):from,items=[],placed=[];
 asRank().filter(x=>!isRep(x.t)).slice(0,3).forEach(x=>items.push({k:'task',t:x.t.title,dur:30,why:x.why}));
 revDue().slice(0,2).forEach(o=>items.push({k:'rev',t:o.l.t,subj:o.s.id,less:o.l.id,dur:20,why:['مراجعة مستحقة']}));
 let skip=0;items.forEach(it=>{let ok=false;for(let s=start;s+it.dur<=to;s+=5){if(used.every(u=>s>=u[1]+gap||s+it.dur+gap<=u[0])){used.push([s,s+it.dur]);placed.push({...it,s,start:mth(s)});ok=true;break}}if(!ok)skip++});
 placed.sort((a,b)=>a.s-b.s);return{dt,placed,skip,closed:day===0&&start+20>to}}
function asOverload(){const O=S.org,win=tmn(O.to)-tmn(O.from),days=[...Array(7)].map((_,i)=>ymd(addD(new Date(),i))),
 L=days.map(d=>{const os=occ(d,null),m=os.reduce((a,o)=>a+o.x.dur,0),tk=S.tasks.filter(t=>!isRep(t)&&!t.done&&t.due===d).length;let ov=false;for(let i=0;i<os.length;i++)for(let j=i+1;j<os.length;j++)if(tmn(os[j].x.start)<tmn(os[i].x.start)+os[i].x.dur&&tmn(os[i].x.start)<tmn(os[j].x.start)+os[j].x.dur)ov=true;return{d,m,tk,ov,sc:m/Math.max(win,60)+tk/6}}),lt=[...L].sort((a,b)=>a.sc-b.sc)[0],out=[];
 L.forEach(x=>{const r=[];if(win>0&&x.m>win*.9)r.push('جلسات '+fm(x.m)+' تقترب من كامل وقت الدراسة ('+fm(win)+')');if(x.tk>=5)r.push(x.tk+' مهام مستحقة');if(x.ov)r.push('حصص متداخلة');if(r.length)out.push({d:x.d,why:r,to:lt&&lt.d!==x.d?lt.d:null})});return out}
function asHabits(){const T0=TD(),days=anDays({from:ymd(addD(new Date(),-13)),to:T0});AN.obs=null;return S.habits.filter(h=>!h.arch).map(h=>anHabit(h,days)).filter(o=>o.rate!==null&&o.n>=5&&o.rate<.5)}
function asGoals(){const T0=TD();return S.goals.map(g=>({g,p:gp(g),dl:g.date?Math.ceil((pd(g.date)-pd(T0))/864e5):null})).filter(x=>x.p<100&&x.dl!==null&&(x.dl<0||(x.dl<=14&&x.p<50)))}
const asNorm=q=>String(q).replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[؟?!.،,]/g,' ').toLowerCase();
function asPer(n){const T0=TD();if(/اليوم/.test(n))return{l:'اليوم',days:[T0]};if(/امس/.test(n))return{l:'أمس',days:[ymd(addD(new Date(),-1))]};if(/الاسبوع (الماضي|السابق)/.test(n))return{l:'الأسبوع الماضي',days:wkD(addD(new Date(),-7))};
 if(/الشهر/.test(n))return{l:'هذا الشهر',days:[...Array(+T0.slice(8))].map((_,i)=>T0.slice(0,8)+p2(i+1))};return{l:'هذا الأسبوع',days:wkD(new Date())}}
function asAsk(q){const n=asNorm(q),T0=TD(),per=asPer(n),c=wrCore(per.days),hs=S.habits.filter(h=>!h.arch),lst=a=>a.map(x=>'• '+x).join('\n');
 if(!n.trim())return'اكتب سؤالك أولًا.';
 if(/(ماذا|ما|بماذا).*(ابدا|افعل|اولويه|اولويات)|ابدا|اولويات/.test(n)){const r=asRank().slice(0,3);return r.length?'أعلى أولوياتك الآن:\n'+lst(r.map(x=>x.t.title+(x.why.length?' ('+x.why.join('، ')+')':''))):'لا مهام مفتوحة مسجّلة.'}
 if(/خطه|جدول اليوم/.test(n)){const p=asPlan(0);return p.placed.length?'خطة مقترحة اليوم (المدد تقديرية):\n'+lst(p.placed.map(i=>i.start+' '+i.t)):'لا مكان متاح في وقت الدراسة اليوم.'}
 if(/(كم|عدد).*(مهمه|مهام)|(مهام|مهمه).*(انجزت|منجز)|انجزت/.test(n)&&!/عاد/.test(n))return 'أنجزتَ '+(c.done.length+c.rcnt)+' مهمة '+per.l+(c.rcnt?' (منها '+c.rcnt+' من المتكررة)':'')+'، حسب سجلاتك.';
 if(/ركزت|تركيز|ساعات|دقائق|دقايق/.test(n))return 'سجّلتَ '+fm(c.fmin)+' تركيزًا '+per.l+(c.fs?' في '+c.fs+' جلسة مكتملة':'')+'.';
 if(/(اقل|اسوا|ضعيف|مهمل).*عاد|عاد.*(اقل|اسوا|ضعيف)/.test(n)){const r=hs.map(h=>({h,p:hRate(h,30)})).sort((a,b)=>a.p-b.p).slice(0,3);return r.length?'الأقل التزامًا (آخر 30 يومًا):\n'+lst(r.map(x=>x.h.title+' — '+x.p+'%')):'لا عادات نشطة.'}
 if(/(اكثر|افضل|منتظم).*عاد|عاد.*(منتظم|افضل|اكثر)|منتظمه/.test(n)){const r=hs.map(h=>({h,p:hRate(h,30)})).sort((a,b)=>b.p-a.p).slice(0,3);return r.length?'الأكثر انتظامًا (آخر 30 يومًا):\n'+lst(r.map(x=>x.h.title+' — '+x.p+'%')):'لا عادات نشطة.'}
 if(/سلسله|streak|متتال/.test(n)){const r=hs.map(h=>({h,s:hSt(h)})).sort((a,b)=>b.s.cur-a.s.cur).slice(0,3);return r.length?'أطول سلاسلك الحالية:\n'+lst(r.map(x=>x.h.title+' — '+x.s.cur+(x.h.type==='weekly'?' أسبوع':' يوم'))):'لا عادات نشطة.'}
 if(/عاد/.test(n)&&/اليوم/.test(n)){const L=hList(T0);return L.length?'عادات اليوم: '+L.filter(h=>h.log[T0]).length+' منجزة من '+L.length+'.':'لا عادات مستحقة اليوم.'}
 if(/متاخر|فات موعد|تاخر/.test(n)){const od=S.tasks.filter(t=>!isRep(t)&&!t.done&&t.due&&t.due<T0).sort(cmpD);return od.length?'لديك '+od.length+' مهام متأخرة:\n'+lst(od.slice(0,5).map(t=>t.title+' ('+fd(t.due)+')')):'لا مهام متأخرة مسجّلة.'}
 if(/اجل|تاجيل|مؤجل/.test(n)){const r=S.tasks.filter(t=>!t.done&&(t.ph||[]).length).sort((a,b)=>b.ph.length-a.ph.length).slice(0,5);return r.length?'أكثر المهام تأجيلًا:\n'+lst(r.map(t=>t.title+' — '+t.ph.length+' مرات')):'لا تأجيلات مسجّلة.'}
 if(/اختبار|امتحان|واجب|تسليم/.test(n)){const r=S.exams.filter(e=>!e.done&&e.date>=T0).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);return r.length?'القادم:\n'+lst(r.map(e=>exName(e)+' — '+exLbl(e))):'لا مواعيد دراسية قادمة مسجّلة.'}
 if(/مراجع/.test(n)){const r=revDue();return r.length?r.length+' مراجعات مستحقة:\n'+lst(r.slice(0,5).map(o=>o.l.t+' ('+o.s.name+')')):'لا مراجعات مستحقة الآن.'}
 if(/هدف|اهداف/.test(n)){const r=S.goals.filter(g=>gp(g)<100);return r.length?'أهدافك النشطة:\n'+lst(r.slice(0,5).map(g=>g.title+' — '+gp(g)+'%')):'لا أهداف نشطة.'}
 if(/نقاط|نقطه|مستوي|xp|مستواي/.test(n)){const L=lvl();return S.gmOff?'الحوافز معطّلة.':'مستواك '+L.n+'، وإجمالي ما كسبته '+L.x+' نقطة، والمتاح للاستبدال '+xpAvail()+'.'}
 return null}
function asContext(){const T0=TD(),w=wrCore(wkD(new Date())),L=[];L.push('ملخص بيانات إنتاجيتي ('+T0+') — بدون نصوص الملاحظات');
 L.push('مهام مفتوحة: '+S.tasks.filter(t=>!isRep(t)&&!t.done).length+' • متأخرة: '+S.tasks.filter(t=>!isRep(t)&&!t.done&&t.due&&t.due<T0).length);
 L.push('هذا الأسبوع: مهام منجزة '+(w.done.length+w.rcnt)+' • تركيز '+fm(w.fmin)+' • التزام العادات '+(w.hp==null?'لا بيانات':w.hp+'%'));
 S.habits.filter(h=>!h.arch).forEach(h=>L.push('عادة: '+h.title+' — التزام 30 يومًا '+hRate(h,30)+'% • سلسلة '+hSt(h).cur));
 S.goals.filter(g=>gp(g)<100).forEach(g=>L.push('هدف: '+g.title+' — '+gp(g)+'%'));
 S.exams.filter(e=>!e.done&&e.date>=T0).slice(0,5).forEach(e=>L.push('موعد: '+exName(e)+' — '+e.date));
 return L.join('\n')}
function asW(){if(S.asOff)return'';const r=asRank().slice(0,3);if(!r.length)return'';return `<h2>أولويات مقترحة</h2>`+r.map(x=>`<div class="card row t-${x.t.pri}"><div class="sp"><b>${esc(x.t.title)}</b><div class="mu">${esc(x.why.join(' • ')||'مفتوحة')}</div></div></div>`).join('')+`<div class="mu" style="text-align:center" data-act="goTab" data-id="assistant">فتح المساعد ←</div>`}
function vAssist(){const rk=asRank().slice(0,5),pl=asPlan(AS.day),ov=asOverload(),nh=asHabits(),gr=asGoals(),pp=S.tasks.filter(t=>!t.done&&(t.ph||[]).length>=2).slice(0,3),rv=revDue(),wk=wrCore(wkD(new Date()));
 const al=[];ov.forEach(x=>al.push(`<b>${DSF[pd(x.d).getDay()]} ${fd(x.d)}</b> مزدحم: ${x.why.join('، ')}${x.to?'. الأخف: '+DSF[pd(x.to).getDay()]+' '+fd(x.to):''}`));
 nh.forEach(o=>al.push(`عادة <b>${esc(o.h.title)}</b>: التزام ${Math.round(o.rate*100)}% في آخر 14 يومًا (${o.n} بنود مسجّلة). فكّر في خفض هدفها أو تغيير وقتها.`));
 pp.forEach(t=>al.push(`مهمة <b>${esc(t.title)}</b> أُجّلت ${t.ph.length} مرات. قسّمها إلى خطوات أصغر.`));
 gr.forEach(x=>al.push(`هدف <b>${esc(x.g.title)}</b>: ${x.dl<0?'تجاوز موعده':'يقترب موعده (باقي '+x.dl+' يوم)'} وتقدّمه ${x.p}%. راجع الموعد أو قلّص النطاق.`));
 if(rv.length)al.push(`${rv.length} مراجعات دراسية مستحقة. وزّعها من تبويب التخطيط ثم التنظيم.`);
 return `<h1>المساعد الذكي</h1><div class="mu">يحلّل بياناتك المسجّلة داخل جهازك فقط بقواعد واضحة، وليس نموذجًا لغويًا.</div>
 <div class="card" style="margin-top:12px"><div class="row" style="gap:6px"><input id="asq" placeholder="اسأل عن بياناتك…" maxlength="120" value="${esc(AS.q)}"><button class="btn sm" data-act="as:ask">اسأل</button></div><div class="tabs" style="margin-top:8px">${AQ.map(q=>`<button data-act="as:q" data-id="${esc(q)}">${esc(q)}</button>`).join('')}</div>${AS.a?`<div style="white-space:pre-wrap;margin-top:8px">${esc(AS.a)}</div>`:''}</div>
 <h2>أولويات اليوم <span class="mu">${rk.length}</span></h2>${rk.length?rk.map((x,i)=>`<div class="card row t-${x.t.pri}"><b>${i+1}</b><div class="sp"><b>${esc(x.t.title)}</b><div class="mu">${esc(x.why.join(' • ')||'مفتوحة')}</div></div></div>`).join(''):'<div class="card empty">لا مهام مفتوحة. وقتٌ جيد للراحة أو للتخطيط.</div>'}
 <h2>خطة مقترحة</h2><div class="modes" style="margin-bottom:8px">${[[0,'اليوم'],[1,'غدًا']].map(x=>`<button class="${AS.day===x[0]?'on':''}" data-act="as:day" data-id="${x[0]}">${x[1]}</button>`).join('')}</div>
 <div class="card">${pl.placed.length?pl.placed.map(i=>`<div class="row" style="padding:4px 0"><span class="tag">${i.start}</span><span class="sp">${i.k==='rev'?'مراجعة: ':''}${esc(i.t)}</span><span class="mu">${i.dur} د</span></div>`).join('')+`<div class="mu" style="margin:6px 0">المدد تقديرية (المهام لا تحمل مدة). تتجنب وقت الحصص والالتزامات الثابتة. لا يُضاف شيء قبل موافقتك.</div><button class="btn w" data-act="as:ok">أضف هذه الحصص إلى الجدول</button>`:`<div class="mu">${pl.closed?'انتهى وقت الدراسة المحدد اليوم. جرّب «غدًا».':'لا عناصر أو لا وقت متاح في أوقات الدراسة المحددة.'}</div>`}${pl.skip?`<div class="mu" style="margin-top:6px;color:var(--rd)">${pl.skip} عناصر لم تجد وقتًا متاحًا.</div>`:''}</div>
 <h2>تنبيهات <span class="mu">${al.length}</span></h2><div class="card">${al.length?al.map(x=>`<div style="padding:5px 0">• ${x}</div>`).join(''):'<div class="mu">لا مؤشرات تستدعي انتباهًا الآن حسب بياناتك المسجّلة.</div>'}</div>
 <h2>ملخص الأسبوع</h2><div class="card"><div>أنجزتَ ${wk.done.length+wk.rcnt} مهمة، وركّزتَ ${fm(wk.fmin)}${wk.hp==null?'':'، والتزام العادات '+wk.hp+'%'}.</div><div class="mu" data-act="goTab" data-id="stats" style="margin-top:6px">التفاصيل في الإحصاءات ←</div></div>
 <div class="card"><div class="mu">خصوصيتك: كل ما سبق يُحسب داخل جهازك ولا يُرسل إلى أي مكان. لاستشارة مساعد ذكاء اصطناعي خارجي، يمكنك نسخ ملخص مُختصر (بلا نصوص ملاحظاتك) ولصقه بنفسك.</div><button class="btn g w" data-act="as:copy">نسخ ملخص لمساعد خارجي</button></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act^="as:"]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
 if(a==='as:ask'||a==='as:q'){const i=document.getElementById('asq');const q=a==='as:q'?id:((i&&i.value)||'');AS.q=q;AS.a=asAsk(q)||'لم أفهم سؤالك. جرّب أحد الأسئلة الجاهزة أعلاه. المساعد يجيب عن بياناتك المسجّلة بقواعد محدودة.';render()}
 else if(a==='as:day'){AS.day=+id;render()}
 else if(a==='as:tgl'){S.asOff=!S.asOff;save();render()}
 else if(a==='as:ok'){const p=asPlan(AS.day);let n=0;p.placed.forEach(i=>{const t=i.k==='task'?i.t:'';if(S.sess.some(x=>x.date===p.dt&&x.start===i.start&&x.title===t&&x.subj===(i.subj||null)))return;S.sess.push({id:uid(),plan:S.curPlan,subj:i.subj||null,less:i.less||null,title:t,date:p.dt,start:i.start,dur:i.dur,rep:'none',until:null,note:'اقتراح المساعد',log:{}});n++});save();render();toast(n?'أُضيفت '+n+' حصص إلى الجدول':'الحصص موجودة مسبقًا')}
 else if(a==='as:copy'){const t=asContext();(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('تم نسخ الملخص')).catch(()=>modal(`<h2>انسخ الملخص</h2><textarea rows="12" readonly dir="rtl" onclick="this.select()">${esc(t)}</textarea>`))}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='asq'){e.preventDefault();const b=document.querySelector('[data-act="as:ask"]');b&&b.click()}});
let curDay=TD();const chkDay=()=>{if(TD()!==curDay){curDay=TD();if(!$('#ov'))render()}};setInterval(chkDay,20000);document.addEventListener('visibilitychange',chkDay);
render();
idbInit();
